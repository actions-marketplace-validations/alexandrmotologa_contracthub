<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="amber-linter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="slate-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Luxury Container: Clean White Squircle with Ultra-Fine Slate Border -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- 1. The Hexagonal Architecture Gateway (Massive 40px Outer Frame) -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <!-- Inner Hexagon Accent (Tech Accent) -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.4" stroke-dasharray="16, 12" />

      <!-- 2. The Muscular Guardian Sentinel Hound -->
      <!-- Outer Body / Neck / Shoulder Base -->
      <path d="
        M 0,-180
        L 60,-175
        L 115,-345
        L 135,-155
        L 190,-60
        L 275,80
        L 295,200
        L 210,225
        L 220,300
        L 120,320
        L 0,360
        L -120,320
        L -220,300
        L -210,225
        L -295,200
        L -275,80
        L -190,-60
        L -135,-155
        L -115,-345
        L -60,-175
        Z
      " fill="url(#slate-body)" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />

      <!-- Inner Ears (Cyan Origami Facets) -->
      <!-- Left Ear Inner -->
      <polygon points="-110,-320 -125,-165 -75,-175" fill="url(#cyan-glow)" />
      <!-- Right Ear Inner -->
      <polygon points="110,-320 125,-165 75,-175" fill="url(#cyan-glow)" />

      <!-- Outer Ear Shadow / Depth -->
      <polygon points="-115,-345 -135,-155 -125,-165 -110,-320" fill="#0284c7" opacity="0.5" />
      <polygon points="115,-345 135,-155 125,-165 110,-320" fill="#0284c7" opacity="0.5" />

      <!-- Shoulder Armor Plates (Tech Facets) -->
      <!-- Left Shoulder Plate -->
      <polygon points="-190,-60 -275,80 -210,130 -160,20" fill="#1e293b" stroke="#334155" stroke-width="4" />
      <polygon points="-275,80 -295,200 -210,225 -210,130" fill="#0f172a" />
      <polygon points="-265,95 -280,185 -225,195" fill="url(#cyan-glow)" opacity="0.85" />

      <!-- Right Shoulder Plate -->
      <polygon points="190,-60 275,80 210,130 160,20" fill="#1e293b" stroke="#334155" stroke-width="4" />
      <polygon points="275,80 295,200 210,225 210,130" fill="#0f172a" />
      <polygon points="265,95 280,185 225,195" fill="url(#cyan-glow)" opacity="0.85" />

      <!-- Head Center & Forehead (Origami Planes) -->
      <polygon points="0,-185 55,-100 0,-40 -55,-100" fill="#334155" stroke="#0f172a" stroke-width="3" />
      <polygon points="0,-185 0,-40 -55,-100" fill="#1e293b" />

      <!-- Temples / Brow -->
      <polygon points="-55,-100 -125,-60 -80,-10 -35,-30" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
      <polygon points="55,-100 125,-60 80,-10 35,-30" fill="#334155" stroke="#0f172a" stroke-width="3" />

      <!-- Snout / Muzzle Bridge (Sculpted Doberman Silhouette) -->
      <polygon points="0,-40 35,-30 40,65 0,90" fill="#475569" stroke="#0f172a" stroke-width="3" />
      <polygon points="0,-40 -35,-30 -40,65 0,90" fill="#334155" stroke="#0f172a" stroke-width="3" />

      <!-- Jowls / Cheeks -->
      <polygon points="-35,-30 -40,65 -85,45 -80,-10" fill="#0f172a" />
      <polygon points="35,-30 40,65 85,45 80,-10" fill="#1e293b" />

      <!-- Nose (Sharp Tech Truffle) -->
      <polygon points="0,60 -30,50 -20,80 0,90" fill="#0284c7" />
      <polygon points="0,60 30,50 20,80 0,90" fill="url(#cyan-glow)" />

      <!-- Chin & Jaw Line -->
      <polygon points="0,90 -25,85 0,120 25,85" fill="#0f172a" />

      <!-- Eyes (Vigilant Linter Cyan Eyes) -->
      <!-- Left Eye -->
      <polygon points="-75,-40 -40,-30 -50,-15 -85,-25" fill="url(#cyan-glow)" stroke="#00f5ff" stroke-width="2" />
      <circle cx="-58" cy="-28" r="4" fill="#ffffff" />

      <!-- Right Eye -->
      <polygon points="75,-40 40,-30 50,-15 85,-25" fill="url(#cyan-glow)" stroke="#00f5ff" stroke-width="2" />
      <circle cx="58" cy="-28" r="4" fill="#ffffff" />

      <!-- 3. Heraldic Schema Chest Shield: The Registry Core -->
      <!-- White Clean Badge in the Muscular Chest -->
      <polygon points="
        0,135
        85,185
        85,285
        0,335
        -85,285
        -85,185
      " fill="#ffffff" stroke="#0f172a" stroke-width="10" stroke-linejoin="round" />

      <!-- Inside Chest: Schema Brackets { } and Contract Validation Check -->
      <!-- Left Bracket { -->
      <path d="
        M -35,190
        C -50,190 -55,205 -55,225
        C -55,235 -62,238 -70,240
        C -62,242 -55,245 -55,255
        C -55,275 -50,290 -35,290
      " fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />

      <!-- Right Bracket } -->
      <path d="
        M 35,190
        C 50,190 55,205 55,225
        C 55,235 62,238 70,240
        C 62,242 55,245 55,255
        C 55,275 50,290 35,290
      " fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" />

      <!-- Center Contract Verified Shield / Checkmark / Node -->
      <polygon points="0,205 28,220 28,255 0,270 -28,255 -28,220" fill="url(#cyan-glow)" />
      <polyline points="-12,237 -3,247 14,228" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

      <!-- 4. Linter Alert / Backward Compatibility Pulse (Base Node) -->
      <g transform="translate(0, 360)">
        <!-- Compatibility Link v1 -> v2 -->
        <circle cx="-50" cy="-15" r="10" fill="#00f5ff" stroke="#0f172a" stroke-width="4" />
        <line x1="-38" y1="-15" x2="38" y2="-15" stroke="#00f5ff" stroke-width="6" stroke-dasharray="6,4" />
        <polygon points="45,-15 32,-22 32,-8" fill="#00f5ff" />
        <circle cx="-50" cy="-15" r="4" fill="#ffffff" />
      </g>

    </g>
  </g>
</svg>