<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="slate-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <linearGradient id="chest-gradient-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="chest-gradient-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Luxury Container: Clean White Squircle with Ultra-Fine Slate Border -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- 1. The Hexagonal Architecture Gateway (Massive 40px Outer Frame) -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <!-- Inner Hexagon Accent (Tech Accent) -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.4" stroke-dasharray="16, 12" />

      <!-- 2. The Muscular Guardian Sentinel Hound Base -->
      <path d="
        M 0,-180
        L 60,-175
        L 115,-345
        L 135,-155
        L 190,-60
        L 275,80
        L 295,200
        L 210,225
        L 220,290
        L 110,310
        L 0,335
        L -110,310
        L -220,290
        L -210,225
        L -295,200
        L -275,80
        L -190,-60
        L -135,-155
        L -115,-345
        L -60,-175
        Z
      " fill="url(#slate-body)" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />

      <!-- Inner Ears (Cyan Origami Facets) -->
      <polygon points="-110,-320 -125,-165 -75,-175" fill="url(#cyan-glow)" />
      <polygon points="110,-320 125,-165 75,-175" fill="url(#cyan-glow)" />

      <!-- Outer Ear Shadow / Depth -->
      <polygon points="-115,-345 -135,-155 -125,-165 -110,-320" fill="#0284c7" opacity="0.5" />
      <polygon points="115,-345 135,-155 125,-165 110,-320" fill="#0284c7" opacity="0.5" />

      <!-- Shoulder Armor Plates (Tech Facets) -->
      <!-- Left Shoulder Plate -->
      <polygon points="-190,-60 -275,80 -210,130 -160,20" fill="#1e293b" stroke="#334155" stroke-width="4" />
      <polygon points="-275,80 -295,200 -210,225 -210,130" fill="#0f172a" />
      <polygon points="-265,95 -280,185 -225,195" fill="url(#cyan-glow)" opacity="0.85" />

      <!-- Right Shoulder Plate -->
      <polygon points="190,-60 275,80 210,130 160,20" fill="#1e293b" stroke="#334155" stroke-width="4" />
      <polygon points="275,80 295,200 210,225 210,130" fill="#0f172a" />
      <polygon points="265,95 280,185 225,195" fill="url(#cyan-glow)" opacity="0.85" />

      <!-- Head Center & Forehead (Origami Planes) -->
      <polygon points="0,-185 55,-100 0,-40 -55,-100" fill="#334155" stroke="#0f172a" stroke-width="3" />
      <polygon points="0,-185 0,-40 -55,-100" fill="#1e293b" />

      <!-- Temples / Brow -->
      <polygon points="-55,-100 -125,-60 -80,-10 -35,-30" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
      <polygon points="55,-100 125,-60 80,-10 35,-30" fill="#334155" stroke="#0f172a" stroke-width="3" />

      <!-- Snout / Muzzle Bridge (Sculpted Doberman Silhouette) -->
      <polygon points="0,-40 35,-30 40,65 0,90" fill="#475569" stroke="#0f172a" stroke-width="3" />
      <polygon points="0,-40 -35,-30 -40,65 0,90" fill="#334155" stroke="#0f172a" stroke-width="3" />

      <!-- Jowls / Cheeks -->
      <polygon points="-35,-30 -40,65 -85,45 -80,-10" fill="#0f172a" />
      <polygon points="35,-30 40,65 85,45 80,-10" fill="#1e293b" />

      <!-- Nose (Sharp Tech Truffle) -->
      <polygon points="0,60 -30,50 -20,80 0,90" fill="#0284c7" />
      <polygon points="0,60 30,50 20,80 0,90" fill="url(#cyan-glow)" />

      <!-- Chin & Jaw Line -->
      <polygon points="0,90 -25,85 0,120 25,85" fill="#0f172a" />

      <!-- Eyes (Vigilant Linter Cyan Eyes) -->
      <polygon points="-75,-40 -40,-30 -50,-15 -85,-25" fill="url(#cyan-glow)" stroke="#00f5ff" stroke-width="2" />
      <circle cx="-58" cy="-28" r="4" fill="#ffffff" />

      <polygon points="75,-40 40,-30 50,-15 85,-25" fill="url(#cyan-glow)" stroke="#00f5ff" stroke-width="2" />
      <circle cx="58" cy="-28" r="4" fill="#ffffff" />

      <!-- 3. Muscular Chest Armor (Clean Origami Facets - No Code, No Brackets) -->
      <!-- Left Pectoral Plate -->
      <polygon points="0,120 -50,150 -150,180 -175,240 -70,230 0,150" fill="url(#chest-gradient-left)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

      <!-- Right Pectoral Plate -->
      <polygon points="0,120 50,150 150,180 175,240 70,230 0,150" fill="url(#chest-gradient-right)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

      <!-- Central Heraldic Sternum Diamond -->
      <polygon points="0,150 -70,230 0,335 70,230" fill="#1e293b" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
      <polygon points="0,150 0,335 70,230" fill="#334155" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />

      <!-- Lower Torso Flanks Left -->
      <polygon points="-70,230 -175,240 -210,225 -220,290 -110,310 0,335" fill="#0b0f19" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />
      
      <!-- Lower Torso Flanks Right -->
      <polygon points="70,230 175,240 210,225 220,290 110,310 0,335" fill="#1e293b" stroke="#0f172a" stroke-width="4" stroke-linejoin="round" />

      <!-- Inner Sleek Cyan Accent Keel (Pure Minimalist Tech Core) -->
      <polygon points="0,200 -18,235 0,270 18,235" fill="url(#cyan-glow)" />

    </g>
  </g>
</svg>