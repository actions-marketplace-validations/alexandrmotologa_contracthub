[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contracthub"
version = "0.1.0"
description = "Universal schema registry and breaking change linter for Protobuf, OpenAPI, and JSON Schema."
readme = "README.md"
authors = [
    { name = "Alexandr Motologa", email = "alexandrmotologa@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "protobuf>=5.26.0",
    "openapi-spec-validator>=0.7.0",
    "jsonschema>=4.21.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
contracthub = "contracthub.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/contracthub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
